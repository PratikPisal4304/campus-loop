name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, architecture, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + lint + test:arch + test. The architecture boundaries fail the build
      # here, which is what makes them real rather than advisory.
      - run: npm run verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_loop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_loop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_loop
      AUTH_SECRET: e2e-secret-not-used-anywhere-real
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_PASSWORD: campus1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `migrate deploy` applies committed migrations without generating new ones — the
      # same command production runs.
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Playwright's webServer starts `npm run start` under CI, so the suite runs against
      # the production build rather than the dev server.
      - run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
