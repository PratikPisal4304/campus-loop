# Local Postgres for development.
#
# Production runs on Neon (provisioned through the Vercel Marketplace); this is the same
# engine locally so migrations and queries behave identically.
#
#   npm run db:up     start
#   npm run db:down   stop (keeps data)
#   docker compose -f docker-compose.dev.yml down -v   wipe data

services:
  postgres:
    image: postgres:17-alpine
    container_name: campus-loop-postgres-dev
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_loop
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_loop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-dev-data:
