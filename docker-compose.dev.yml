# Local MongoDB as a SINGLE-NODE REPLICA SET.
#
# The replica set is not cosmetic: sending a message writes the Message and bumps the
# Conversation's preview/unread counters, and closing a listing touches the listing plus
# every saved-item reference. Those pairs go through withTransaction(), and MongoDB only
# supports transactions on a replica set — a standalone mongod would fail at runtime.
#
#   npm run db:up     start
#   npm run db:down   stop (keeps data)
#   docker compose -f docker-compose.dev.yml down -v   wipe data

services:
  mongo:
    image: mongo:7
    container_name: campus-loop-mongo-dev
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it has a primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-dev-data:
