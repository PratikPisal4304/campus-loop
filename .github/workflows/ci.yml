name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, architecture, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + lint + test:arch + test. The architecture boundaries fail the build
      # here, which is what makes them real rather than advisory.
      - run: npm run verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: campus_loop_e2e
      AUTH_SECRET: e2e-secret-not-used-anywhere-real
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_PASSWORD: campus1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The service container starts a standalone mongod, but transactions need a replica
      # set, so promote it in place before anything connects.
      - name: Promote MongoDB to a single-node replica set
        run: |
          docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            ok=$(docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet \
              --eval "try { rs.status().myState === 1 } catch (e) { false }")
            [ "$ok" = "true" ] && echo "replica set has a primary" && exit 0
            sleep 2
          done
          echo "replica set never elected a primary" && exit 1

      - run: npm run db:indexes
      - run: npm run db:seed

      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Playwright's webServer starts `npm run start` under CI, so the suite runs against
      # the production build rather than the dev server.
      - run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
